[package]
name = "wasche"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "WhatsApp MCP server and background broadcast scheduler sidecar"

[lib]
name = "wasche"
path = "src/lib.rs"

[[bin]]
name = "wasche"
path = "src/main.rs"

[dependencies]
# Official Model Context Protocol Rust SDK
rmcp = { version = "3.8", features = ["server", "transport-io", "macros"] }
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# WhatsApp Protocol Engine
whatsapp-rust = { git = "https://github.com/crmne/whatsapp-rust", rev = "94f7c1376f8f6a77c55d85570a260600ad27de0b", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native"] }

# Storage
rusqlite = { version = "0.40", features = ["bundled"] }

# Utilities
rand = "0.9"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
directories = "6"
base64 = "0.22"
rust-embed = { version = "8.13" }
tokio-util = "0.7"
ureq = "3.5"
[dev-dependencies]
tempfile = "3"
